name: Build APK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Cobalt platform"
        default: "android-arm64"
      config:
        description: "Build config"
        default: "qa"
      target:
        description: "Ninja target"
        default: "cobalt_apk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git ~/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync dependencies
        run: gclient sync -D --no-history --nohooks && gclient runhooks

      - name: Build
        run: |
          cobalt/build/gn.py -p ${{ inputs.platform }} -c ${{ inputs.config }}
          autoninja -C out/${{ inputs.platform }}_${{ inputs.config }} ${{ inputs.target }}

      - name: Collect APK
        run: |
          mkdir -p dist
          find out/${{ inputs.platform }}_${{ inputs.config }} -name "*.apk" -not -path "*/gen/*" -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: dist/*.apk
          if-no-files-found: error
