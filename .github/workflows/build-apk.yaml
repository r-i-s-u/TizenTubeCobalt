name: Build APK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Cobalt platform"
        default: "android-arm64"
      config:
        description: "Build config"
        default: "qa"
      target:
        description: "Ninja target"
        default: "cobalt_apk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git ~/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create .gclient
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {"checkout_android": True},
            },
          ]
          target_os = ["android"]
          EOF

      - name: Sync dependencies
        run: gclient sync -D --no-history --nohooks && gclient runhooks

      - name: Create debug keystore
        working-directory: src
        run: |
          OUT=out/${{ inputs.platform }}_${{ inputs.config }}
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          T=$(realpath -m $OUT/../../../../../.android)
          mkdir -p $T
          cp ~/.android/debug.keystore $T/debug.keystore
          ls -l ~/.android $T
          
      - name: Build
        working-directory: src
        run: |
          OUT=out/${{ inputs.platform }}_${{ inputs.config }}
          cobalt/build/gn.py -p ${{ inputs.platform }} -c ${{ inputs.config }} || true
          echo 'use_remoteexec = false' >> $OUT/args.gn
          gn gen $OUT
          cat $OUT/args.gn
          autoninja -C $OUT ${{ inputs.target }}

      - name: Collect APK
        working-directory: src
        run: |
          mkdir -p dist
          find out/${{ inputs.platform }}_${{ inputs.config }} -name "*.apk" -not -path "*/gen/*" -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: src/dist/*.apk
          if-no-files-found: error
