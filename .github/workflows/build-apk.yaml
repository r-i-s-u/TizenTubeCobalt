name: Build Cobalt APK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Architecture'
        required: true
        default: 'android-arm'
        type: choice
        options:
          - android-arm
          - android-arm64
      build_type:
        description: 'Build Type'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - gold
          - devel
      fast_build:
        description: 'Fast Build (symbol_level=0: cuts compile time, RAM, and object file size by ~40%)'
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.build_type }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (12 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Checkout Source Code (Full History)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Install System Dependencies, 32-bit Arch & ccache
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gperf bison flex python3-setuptools \
            gcc-multilib g++-multilib \
            libc6:i386 libstdc++6:i386 libgcc-s1:i386 \
            ninja-build openjdk-17-jdk ccache

      - name: Restore Compiler Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cobalt-${{ inputs.platform }}-${{ inputs.build_type }}-${{ github.run_id }}
          restore-keys: |
            ccache-cobalt-${{ inputs.platform }}-${{ inputs.build_type }}-
            ccache-cobalt-

      - name: Set up Depot Tools & Sync Dependencies
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PWD/depot_tools:$PATH
          echo "$PWD/depot_tools" >> $GITHUB_PATH

          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          EOF

          gclient sync --no-history

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "C=US, O=Android, CN=Android Debug"

          # Propagate keystore to relative parent directories
          mkdir -p ../.android ../../.android ../../../.android
          cp ~/.android/debug.keystore ../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../../.android/ 2>/dev/null || true

      - name: Generate GN Build Files & Compile Cobalt APK
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          export PATH=$PWD/depot_tools:$PATH
          cd src

          OUT_DIR="out/${{ inputs.platform }}_${{ inputs.build_type }}"

          # Configure ccache
          export CCACHE_DIR=~/.cache/ccache
          export CCACHE_MAXSIZE=10G
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=6
          ccache -M 10G
          ccache -s

          echo "====> Generating GN build configuration..."
          python3 cobalt/build/gn.py -p ${{ inputs.platform }} -c ${{ inputs.build_type }} --no-rbe

          # Strip heavy debug symbols if fast_build is enabled
          if [ "${{ inputs.fast_build }}" = "true" ]; then
            echo "====> Fast build enabled: replacing symbol_level with 0"
            sed -i -E 's/symbol_level = [0-9]+/symbol_level = 0/g' ${OUT_DIR}/args.gn
          fi

          # Enable ccache wrapper in GN
          sed -i '/cc_wrapper/d' ${OUT_DIR}/args.gn
          echo 'cc_wrapper = "ccache"' >> ${OUT_DIR}/args.gn

          echo "====> Re-running gn gen with optimizations..."
          gn gen ${OUT_DIR}

          echo "====> Active args.gn configuration:"
          cat ${OUT_DIR}/args.gn

          echo "====> Compiling cobalt_apk with Ninja (4.2h safety window)..."
          set +e
          timeout 4.2h ninja -C ${OUT_DIR} -j 2 cobalt_apk
          NINJA_EXIT=$?
          set -e

          echo "NINJA_EXIT_CODE=${NINJA_EXIT}" >> $GITHUB_ENV
          echo "Ninja exited with code: ${NINJA_EXIT}"

          # Show ccache statistics
          ccache -s

          if [ ${NINJA_EXIT} -eq 0 ]; then
            echo "====> cobalt_apk build completed successfully!"
          elif [ ${NINJA_EXIT} -eq 124 ]; then
            echo "====> 4.2h safety timeout reached. Compiler cache has been saved and will continue on next run."
          else
            echo "====> Compilation error occurred (exit code: ${NINJA_EXIT})."
            exit ${NINJA_EXIT}
          fi

      - name: Cleanup Compiler Processes
        if: always()
        run: |
          killall -9 ninja clang clang++ python3 2>/dev/null || true
          sleep 5

      - name: Save Compiler Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-cobalt-${{ inputs.platform }}-${{ inputs.build_type }}-${{ github.run_id }}

      - name: Inspect generated APKs
        if: always()
        run: |
          OUT_DIR="src/out/${{ inputs.platform }}_${{ inputs.build_type }}"

          echo "Searching for APKs under: ${OUT_DIR}"
          find "$OUT_DIR" -type f -name '*.apk' -print 2>/dev/null || true

          APK_COUNT=$(find "$OUT_DIR" -type f -name '*.apk' 2>/dev/null | wc -l)
          echo "APK_COUNT=${APK_COUNT}"

          if [ "$APK_COUNT" -eq 0 ]; then
            if [ "${NINJA_EXIT_CODE:-}" = "124" ]; then
              echo "::notice::No APK was produced because the build timed out."
            else
              echo "::warning::No APK was produced. Ninja exit code: ${NINJA_EXIT_CODE:-unknown}"
            fi
          fi

      - name: Upload Cobalt APK Artifact
        if: always() && env.NINJA_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-${{ inputs.platform }}-${{ inputs.build_type }}-apk
          path: |
            src/out/${{ inputs.platform }}_${{ inputs.build_type }}/apks/*.apk
            src/out/${{ inputs.platform }}_${{ inputs.build_type }}/*_apk/*.apk
          if-no-files-found: error

      - name: Auto-Resume Workflow if Timed Out
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Total elapsed time: ${DURATION}s"

          # Check if APK was generated
          APK_COUNT=$(find src/out/${{ inputs.platform }}_${{ inputs.build_type }} -name "*.apk" 2>/dev/null | wc -l)
          if [ ${APK_COUNT} -gt 0 ]; then
            echo "APK was successfully created! No continuation needed."
            exit 0
          fi

          if [ "${NINJA_EXIT_CODE}" = "124" ] || [ ${DURATION} -gt 14400 ]; then
            echo "====> Time limit reached before full link. Re-triggering next run with warm compiler cache..."
            gh workflow run "${{ github.workflow }}" \
              --repo "${{ github.repository }}" \
              -f platform="${{ inputs.platform }}" \
              -f build_type="${{ inputs.build_type }}" \
              -f fast_build="${{ inputs.fast_build }}" \
              --ref "${{ github.ref }}"
          else
            echo "====> Not a timeout condition (duration < 4h and exit code != 124). Halting without auto-resume."
          fi
